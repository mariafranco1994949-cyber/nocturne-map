<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOCTURNE | Second Life</title>

<script src="https://maps.secondlife.com/_scripts/sl.mapapi2.js"></script>
<link rel="stylesheet"
      href="https://maps.secondlife.com/_styles/sl.mapapi2.css">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #080808;
        font-family: Arial, sans-serif;
    }

    #map-container {
        width: 100%;
        height: 100vh;
    }

    #status {
        position: absolute;
        z-index: 9999;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,.85);
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
    }

    .nocturne-popup {
        text-align: center;
        min-width: 190px;
    }

    .nocturne-popup h2 {
        margin: 5px 0;
    }

    .teleport {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 18px;
        background: #6b168c;
        color: white !important;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div id="status">Cargando NOCTURNE...</div>
<div id="map-container"></div>

<script>

const REGION = "Lobishomen";

const LOCAL_X = 252;
const LOCAL_Y = 201;
const LOCAL_Z = 3401;


/* ------------------------------------------------
   1 - Obtener automáticamente la posición global
       de la región Lobishomen
------------------------------------------------ */

function cargarRegion() {

    const script = document.createElement("script");

    script.src =
        "https://cap.secondlife.com/cap/0/" +
        "d661249b-2b5a-4436-966a-3d3b8d7a574f" +
        "?var=regionCoords&sim_name=" +
        encodeURIComponent(REGION);

    script.onload = crearMapa;

    script.onerror = function() {
        document.getElementById("status").innerHTML =
            "No se pudieron obtener las coordenadas de Lobishomen.";
    };

    document.head.appendChild(script);
}


/* ------------------------------------------------
   2 - Crear mapa
------------------------------------------------ */

function crearMapa() {

    if (typeof regionCoords === "undefined") {
        document.getElementById("status").innerHTML =
            "No se encontró la región.";
        return;
    }


    /* Posición exacta dentro de la región */

    const MAP_X =
        regionCoords.x + (LOCAL_X / 256);

    const MAP_Y =
        regionCoords.y + (LOCAL_Y / 256);


    /* Crear mapa */

    const mapa =
        SLMap(document.getElementById("map-container"));


    /* Second Life utiliza orden Y,X */

    mapa.setView(
        [MAP_Y, MAP_X],
        8
    );


    /* ------------------------------------------------
       PIN PERSONALIZADO NOCTURNE
    ------------------------------------------------ */

    const nocturneIcon = L.icon({

        iconUrl: "nocturne-pin.png",

        iconSize: [100, 120],

        iconAnchor: [50, 120],

        popupAnchor: [0, -115]
    });


    /* Crear marcador */

    const marker = L.marker(
        [MAP_Y, MAP_X],
        {
            icon: nocturneIcon
        }
    ).addTo(mapa);


    /* ------------------------------------------------
       Ventana al tocar el pin
    ------------------------------------------------ */

    marker.bindPopup(`

        <div class="nocturne-popup">

            <h2>NOCTURNE</h2>

            <b>Gothic & Kawaii Gothic</b>

            <p>
            Shapes • Skins • Tattoos<br>
            Eyes • Add-ons • Accessories
            </p>

            <a class="teleport"
               href="secondlife://Lobishomen/252/201/3401">

               TELEPORT

            </a>

        </div>

    `);


    document.getElementById("status").style.display = "none";

}


/* Iniciar */

window.addEventListener(
    "load",
    cargarRegion
);

</script>

</body>
</html>
